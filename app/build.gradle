plugins {
    id "com.android.application"
}

android {
    namespace "pe.jerryshop.caller.app"
    compileSdk 34

    defaultConfig {
        applicationId "pe.jerryshop.caller"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        release {
            storeFile file("jerrycaller.jks")
            storePassword "jerrycaller"
            keyAlias "jerrycaller"
            keyPassword "jerrycaller"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
